modLoader = "kotlinforforge"
loaderVersion = "[5.10,)"
issueTrackerURL = "https://github.com/saultsc/battle_showdown/issues"
license = "MPL-2.0"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Cobblemon: Battle Showdown"
authors = "saultsc"
description = '''
Adds a team preview before PvP battles: see your rival's team and pick your lead Pokémon.
'''
logoFile = "assets/${mod_id}/icon.png"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "cobblemon"
type = "required"
versionRange = "[1.8.1,1.9.0)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "mixins.${mod_id}.json"
